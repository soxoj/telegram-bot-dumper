<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Dump Viewer</title>
<style>
  :root{
    --blue:#3390ec; --bg:#ffffff; --panel:#ffffff; --border:#e6e6e6;
    --hover:#f4f4f5; --active:#3390ec; --in:#ffffff; --out:#eeffde;
    --muted:#8b96a3; --text:#000000;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);
       background:#dfe6ee;overflow:hidden}
  #app{display:flex;height:100vh}
  /* login */
  #login{position:fixed;inset:0;background:#dfe6ee;display:flex;align-items:center;justify-content:center;z-index:10}
  #login .card{background:#fff;border-radius:12px;padding:32px;width:min(400px,90vw);box-shadow:0 6px 30px rgba(0,0,0,.15);text-align:center}
  #login h1{font-size:20px;margin:0 0 6px}
  #login p{color:var(--muted);margin:0 0 20px}
  #login input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none}
  #login input:focus{border-color:var(--blue)}
  #login button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  #login button:disabled{opacity:.6;cursor:default}
  #err{color:#e53935;margin-top:12px;min-height:18px;font-size:13px}
  /* sidebar */
  #side{width:360px;min-width:360px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
  #side header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
  #side header .title{font-weight:600}
  #side header .sub{color:var(--muted);font-size:12px}
  #list{overflow-y:auto;flex:1}
  .row{display:flex;gap:12px;padding:10px 14px;cursor:pointer;align-items:center;border-bottom:1px solid #f2f2f2}
  .row:hover{background:var(--hover)}
  .row.active{background:var(--active)}
  .row.active .name,.row.active .snippet,.row.active .time,.row.active .badge{color:#fff}
  .row .meta{flex:1;min-width:0}
  .row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{color:var(--muted);font-size:12px;white-space:nowrap}
  .snippet{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .badge{font-size:11px;color:var(--muted)}
  .live{font-size:11px;padding:1px 7px;border-radius:8px;margin-left:6px;white-space:nowrap}
  .live.on{background:#e6f4ea;color:#1a7f37}
  .live.off{background:#fdecea;color:#c62828}
  .live.wait{background:#eef1ff;color:#4455aa}
  /* avatar */
  .av{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:17px}
  .av.sm{width:40px;height:40px;font-size:15px}
  /* main */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;background:
     radial-gradient(circle at 20% 20%, #d3ddea 0, transparent 40%),
     radial-gradient(circle at 80% 70%, #d3ddea 0, transparent 40%), #dbe4ec}
  #main header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--border)}
  #main header .name{font-weight:600}
  #main header .sub{color:var(--muted);font-size:12px}
  #msgs{flex:1;overflow-y:auto;padding:18px 8%;display:flex;flex-direction:column;gap:2px}
  #empty{margin:auto;color:#5c6b7a;background:rgba(255,255,255,.5);padding:8px 16px;border-radius:16px}
  .day{align-self:center;background:rgba(0,0,0,.28);color:#fff;font-size:12px;padding:3px 10px;border-radius:12px;margin:12px 0}
  .b{max-width:70%;padding:6px 10px 5px;border-radius:12px;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08);
     white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;margin-top:2px}
  .b.in{align-self:flex-start;background:var(--in);border-top-left-radius:4px}
  .b.out{align-self:flex-end;background:var(--out);border-top-right-radius:4px}
  .b .t{font-size:11px;color:var(--muted);float:right;margin:6px 0 0 10px;position:relative;top:3px}
  .b img.ph{max-width:min(360px,60vw);border-radius:8px;display:block;cursor:zoom-in;margin-bottom:2px}
  .b video,.b audio{max-width:min(360px,60vw);border-radius:8px;display:block}
  .file{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;padding:4px 2px}
  .file .ic{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .file .fn{font-weight:500;word-break:break-all}
  /* search */
  #searchbar{padding:8px 12px;border-bottom:1px solid var(--border)}
  #searchbar input{width:100%;padding:8px 14px;border:1px solid var(--border);border-radius:18px;
     font-size:14px;outline:none;background:#f4f4f5}
  #searchbar input:focus{border-color:var(--blue);background:#fff}
  #results{overflow-y:auto;flex:1}
  .hint{color:var(--muted);text-align:center;padding:24px 16px}
  mark{background:#fff3b0;color:inherit;border-radius:2px;padding:0 1px}
  .b.hl{animation:hl 1.6s ease}
  @keyframes hl{0%,55%{background:#fff3b0}100%{background:inherit}}
  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
  #lb img{max-width:92vw;max-height:92vh;border-radius:6px}
  /* profile modal */
  #chatav{cursor:pointer}
  #pmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:25}
  #pmodal.open{display:flex}
  .pcard{background:#fff;border-radius:12px;width:min(360px,92vw);max-height:92vh;overflow:auto;
     box-shadow:0 10px 40px rgba(0,0,0,.3);position:relative}
  .px{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.35);color:#fff;border:0;
     width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;z-index:3}
  .pimg{position:relative;width:100%;aspect-ratio:1/1;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pimg img{width:100%;height:100%;object-fit:cover;cursor:pointer}
  #pinit{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:72px;font-weight:600;cursor:pointer}
  .pnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;border:0;
     width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;display:none;z-index:2}
  .pnav.prev{left:8px} .pnav.next{right:8px}
  .pcount{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);
     color:#fff;font-size:12px;padding:2px 10px;border-radius:10px;display:none}
  .pbody{padding:14px 16px}
  .pname{font-size:18px;font-weight:600;margin-bottom:8px}
  .prow{display:flex;gap:10px;padding:5px 0;border-top:1px solid #f0f0f0;font-size:14px}
  .pk{color:var(--muted);min-width:80px}
  .pv{color:var(--text);word-break:break-word}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h1>🤖 Bot Dump Viewer</h1>
    <p>Paste the bot token to open its dumped chats</p>
    <input id="token" type="password" placeholder="123456789:AA..." autocomplete="off" spellcheck="false">
    <button id="go">Open</button>
    <div id="err"></div>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="side">
    <header>
      <span id="botav"></span>
      <div><div class="title" id="botname"></div>
        <div class="sub"><span id="botsub"></span><span id="livebadge" class="live"></span></div></div>
    </header>
    <div id="searchbar"><input id="q" type="search" placeholder="Search messages" autocomplete="off" spellcheck="false"></div>
    <div id="list"></div>
    <div id="results" style="display:none"></div>
  </aside>
  <section id="main">
    <header id="chathead" style="display:none">
      <span id="chatav"></span>
      <div><div class="name" id="chatname"></div><div class="sub" id="chatsub"></div></div>
    </header>
    <div id="msgs"><div id="empty">Select a chat to read the dialog</div></div>
  </section>
</div>

<div id="lb"><img></div>

<div id="pmodal">
  <div class="pcard">
    <button class="px" id="pclose">×</button>
    <div class="pimg" id="pimg">
      <img id="pphoto" alt="">
      <div id="pinit"></div>
      <button class="pnav prev" id="pprev">‹</button>
      <button class="pnav next" id="pnext">›</button>
      <div class="pcount" id="pcount"></div>
    </div>
    <div class="pbody">
      <div class="pname" id="pname"></div>
      <div class="pmeta" id="pmeta"></div>
    </div>
  </div>
</div>

<script>
const COLORS = ['#e17076','#7bc862','#e5ca77','#65aadd','#a695e7','#ee7aae','#6ec9cb'];
const $ = s => document.querySelector(s);
function el(tag, props={}, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class') e.className=v; else if(k==='text') e.textContent=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  for(const c of kids) if(c) e.append(c);
  return e;
}
const initials = n => (n||'?').replace(/^@/,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const color = id => COLORS[Math.abs([...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0))%COLORS.length];
function avatar(cls, name, id, url){
  if(url) return el('img',{class:cls, src:url, alt:''});
  const a = el('div',{class:cls, text:initials(name)});
  a.style.background = color(id);
  return a;
}
function fmtTime(d){ const t=d&&d.slice(11,16); return t||''; }
function fmtListDate(d){
  if(!d) return '';
  const day=d.slice(0,10), today=new Date().toISOString().slice(0,10);
  return day===today ? d.slice(11,16) : day;
}
function dayLabel(d){ return d.slice(0,10); }

let BOT=null, TOKEN='', OPEN=null, OPEN_LASTDAY='';
const CHATS=new Map(), ROWS=new Map(), SEEN=new Set();

async function doLogin(){
  const token = $('#token').value.trim();
  if(!token) return;
  $('#go').disabled=true; $('#err').textContent='';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    const data = await r.json();
    if(!r.ok){ $('#err').textContent=data.error||'Login failed'; return; }
    localStorage.setItem('tgv_token', token);
    BOT=data; TOKEN=token;
    CHATS.clear();
    for(const c of data.chats) CHATS.set(String(c.id), c);
    render();
    startLive();
  }catch(e){ $('#err').textContent=String(e); }
  finally{ $('#go').disabled=false; }
}
function fileUrl(chat, name){
  return '/file/'+BOT.botId+'/'+encodeURIComponent(chat)+'/'+name.split('/').map(encodeURIComponent).join('/');
}
const sortedChats = () => [...CHATS.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function updateBotSub(){ $('#botsub').textContent=(BOT.bot.username?'@'+BOT.bot.username+' · ':'')+CHATS.size+' chats'; }
function render(){
  $('#login').style.display='none';
  $('#app').style.display='flex';
  $('#botname').textContent = BOT.bot.name;
  updateBotSub();
  const bav=$('#botav'); bav.innerHTML='';
  bav.append(avatar('av sm', BOT.bot.name, BOT.bot.id, BOT.bot.avatar?fileUrl(BOT.bot.id,BOT.bot.avatar):null));
  const list = $('#list'); list.innerHTML=''; ROWS.clear();
  for(const c of sortedChats()) list.append(makeRow(c));
}
function makeRow(c){
  const id=String(c.id);
  const row = el('div',{class:'row'+(OPEN===id?' active':''), onclick:()=>openChat(id,row)},
    avatar('av', c.name, id, c.avatar?fileUrl(id,c.avatar):null),
    el('div',{class:'meta'},
      el('div',{class:'top'}, el('div',{class:'name',text:(c.name||('Chat '+id))+(c.scam?' ⚠️':(c.verified?' ✓':''))}), el('div',{class:'time',text:fmtListDate(c.date)})),
      el('div',{class:'top'}, el('div',{class:'snippet',text:c.last||' '}), el('div',{class:'badge',text:c.count||''}))
    ));
  ROWS.set(id,row);
  return row;
}
function rebuildRow(id, top){
  const c=CHATS.get(id); if(!c) return;
  const old=ROWS.get(id), row=makeRow(c);        // makeRow overwrites ROWS[id]
  if(top){ if(old) old.remove(); $('#list').prepend(row); }
  else if(old) old.replaceWith(row); else $('#list').prepend(row);
}
function bubble(m){
  const b = el('div',{class:'b '+(m.out?'out':'in'), 'data-mid':m.id});
  for(const name of m.media) b.append(mediaNode(OPEN,name));
  if(m.text) b.append(document.createTextNode(m.text));
  b.append(el('span',{class:'t',text:fmtTime(m.date)}));
  return b;
}
async function openChat(id, row, targetId){
  id=String(id); OPEN=id; OPEN_LASTDAY=''; SEEN.clear();
  document.querySelectorAll('.row.active').forEach(r=>r.classList.remove('active'));
  (row||ROWS.get(id))?.classList.add('active');
  const c=CHATS.get(id)||{id,name:'Chat '+id};
  $('#chathead').style.display='flex';
  $('#chatname').textContent = c.name||('Chat '+id);
  $('#chatsub').textContent = (c.username?'@'+c.username+' · ':'') + 'id '+id;
  const ca=$('#chatav'); ca.innerHTML='';
  ca.append(avatar('av sm', c.name, id, c.avatar?fileUrl(id,c.avatar):null));
  const box=$('#msgs'); box.innerHTML='<div id="empty">Loading…</div>';
  const r = await fetch('/api/messages?bot='+BOT.botId+'&chat='+encodeURIComponent(id));
  const {messages} = await r.json();
  if(OPEN!==id) return;                            // user switched away while loading
  box.innerHTML='';
  if(!messages.length) box.append(el('div',{id:'empty',text:'No messages yet'}));
  for(const m of messages){
    const day=dayLabel(m.date);
    if(day!==OPEN_LASTDAY){ box.append(el('div',{class:'day',text:day})); OPEN_LASTDAY=day; }
    box.append(bubble(m)); SEEN.add(m.id);
  }
  const t = targetId!=null && box.querySelector('[data-mid="'+targetId+'"]');
  if(t){ t.scrollIntoView({block:'center'}); t.classList.add('hl'); setTimeout(()=>t.classList.remove('hl'),1600); }
  else box.scrollTop=box.scrollHeight;
}
// ---- live stream ----
function onLiveMessage(chatId, m){
  LIVE_N++; paintLive();
  chatId=String(chatId);
  let c=CHATS.get(chatId);
  if(!c){ c={id:chatId, name:'Chat '+chatId, count:0}; CHATS.set(chatId,c); }
  c.count=(c.count||0)+1;
  c.last=m.text ? m.text.split('\n')[0] : (m.media&&m.media.length ? '📎 '+m.media[0].split('/').pop() : '');
  c.date=m.date;
  rebuildRow(chatId, true);
  updateBotSub();
  if(OPEN===chatId && !SEEN.has(m.id)){
    const box=$('#msgs'); const empty=$('#empty'); if(empty) empty.remove();
    const day=dayLabel(m.date);
    if(day!==OPEN_LASTDAY){ box.append(el('div',{class:'day',text:day})); OPEN_LASTDAY=day; }
    box.append(bubble(m)); SEEN.add(m.id); box.scrollTop=box.scrollHeight;
  }
}
function onLiveChat(meta){
  const id=String(meta.id);
  const c=Object.assign(CHATS.get(id)||{id,count:0},
    {name:meta.name, username:meta.username, verified:meta.verified, scam:meta.scam, avatar:meta.avatar});
  CHATS.set(id,c);
  rebuildRow(id, false);
  if(OPEN===id){
    $('#chatname').textContent=c.name;
    const ca=$('#chatav'); ca.innerHTML=''; ca.append(avatar('av sm',c.name,id,c.avatar?fileUrl(id,c.avatar):null));
  }
}
let LIVE_N=0, LIVE_STATUS='connecting';
function paintLive(){
  const b=$('#livebadge'); if(!b) return;
  const map={live:['● live','on'], dumping:['● dumping','wait'], connecting:['connecting…','wait'],
             stopped:['○ stopped','off'], offline:['○ offline','off']};
  const [t,c]=map[LIVE_STATUS]||['○ '+LIVE_STATUS,'off'];
  b.textContent=t+(LIVE_N?' · '+LIVE_N:''); b.className='live '+c;
}
function startLive(){
  LIVE_N=0; LIVE_STATUS='connecting'; paintLive();
  const es=new EventSource('/api/stream');
  es.onmessage=ev=>{
    let e; try{ e=JSON.parse(ev.data); }catch{ return; }
    if(e.type==='message') onLiveMessage(e.chat, e.message);
    else if(e.type==='chat') onLiveChat(e.chat);
    else if(e.type==='status'){ LIVE_STATUS=e.status; paintLive(); }
    else if(e.type==='error'){ console.warn('live:', e.error); }
  };
  es.onerror=()=>{ LIVE_STATUS='offline'; paintLive(); };
  fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN})})
    .then(r=>r.json()).then(r=>{ if(r.error){ LIVE_STATUS='✗ '+r.error; paintLive(); } }).catch(()=>{});
}
function mediaNode(chat, name){
  const url=fileUrl(chat,'media/'+name);
  const ext=(name.split('.').pop()||'').toLowerCase();
  if(['jpg','jpeg','png','gif','webp'].includes(ext)){
    const img=el('img',{class:'ph',src:url,loading:'lazy'});
    img.addEventListener('click',()=>{ $('#lb img').src=url; $('#lb').style.display='flex'; });
    return img;
  }
  if(['mp4','mov','webm'].includes(ext)) return el('video',{src:url,controls:''});
  if(['mp3','ogg','oga','wav','m4a'].includes(ext)) return el('audio',{src:url,controls:''});
  return el('a',{class:'file',href:url,download:'',target:'_blank'},
    el('div',{class:'ic',text:'📄'}), el('div',{class:'fn',text:name}));
}
// ---- global search ----
function showResults(on){ $('#list').style.display=on?'none':''; $('#results').style.display=on?'':'none'; }
function snippet(text, q, span=120){
  const one=text.replace(/\s+/g,' ').trim();
  const idx=one.toLowerCase().indexOf(q.toLowerCase());
  if(one.length<=span || idx<0) return one;
  const start=Math.max(0, idx-30);
  return (start>0?'…':'')+one.slice(start,start+span)+(start+span<one.length?'…':'');
}
function highlight(text, q){
  const frag=document.createDocumentFragment(), low=text.toLowerCase(), ql=q.toLowerCase();
  let i=0, idx;
  while(ql && (idx=low.indexOf(ql,i))>=0){
    if(idx>i) frag.append(document.createTextNode(text.slice(i,idx)));
    frag.append(el('mark',{text:text.slice(idx,idx+q.length)}));
    i=idx+q.length;
  }
  frag.append(document.createTextNode(text.slice(i)));
  return frag;
}
function makeResultRow(m, q){
  const cid=String(m.chat), c=CHATS.get(cid)||{};
  const row=el('div',{class:'row', onclick:()=>openChat(cid, ROWS.get(cid), m.id)},
    avatar('av', m.chatName, cid, c.avatar?fileUrl(cid,c.avatar):null),
    el('div',{class:'meta'},
      el('div',{class:'top'}, el('div',{class:'name',text:m.chatName}), el('div',{class:'time',text:fmtListDate(m.date)})),
      el('div',{class:'snippet'})));
  row.querySelector('.snippet').append(highlight(snippet(m.text,q),q));
  return row;
}
let SEARCH_T=null, SEARCH_Q='';
function doSearch(q){
  SEARCH_Q=q;
  if(!q){ showResults(false); $('#results').innerHTML=''; return; }
  showResults(true);
  const box=$('#results'); box.innerHTML='<div class="hint">Searching…</div>';
  fetch('/api/search?bot='+BOT.botId+'&q='+encodeURIComponent(q))
    .then(r=>r.json()).then(d=>{
      if(SEARCH_Q!==q) return;                     // a newer query already fired
      box.innerHTML=''; const res=d.results||[];
      if(!res.length){ box.append(el('div',{class:'hint',text:'Nothing found'})); return; }
      for(const m of res) box.append(makeResultRow(m,q));
    }).catch(()=>{ box.innerHTML='<div class="hint">Search failed</div>'; });
}
$('#q').addEventListener('input',e=>{ clearTimeout(SEARCH_T); const q=e.target.value.trim(); SEARCH_T=setTimeout(()=>doSearch(q),200); });

// ---- profile modal + photo carousel ----
let PROF={user:{}, photos:[], idx:0, carousel:false, chat:null};
function renderProfile(){
  const u=PROF.user||{};
  const name=[u.first_name,u.last_name].filter(Boolean).join(' ') || (u.username?'@'+u.username:('Chat '+PROF.chat));
  $('#pname').textContent = name + (u.scam||u.fake?' ⚠️':(u.verified?' ✓':''));
  const meta=$('#pmeta'); meta.innerHTML='';
  const add=(k,v)=>{ if(v) meta.append(el('div',{class:'prow'}, el('span',{class:'pk',text:k}), el('span',{class:'pv',text:v}))); };
  add('Username', u.username?'@'+u.username:'');
  add('ID', String(PROF.chat));
  add('Phone', u.phone?'+'+u.phone:'');
  const tags=['bot','premium','verified','scam','fake'].filter(f=>u[f]);
  add('Flags', tags.join(', '));
  const img=$('#pphoto'), init=$('#pinit');
  if(PROF.photos.length){
    img.style.display=''; init.style.display='none';
    img.src=fileUrl(PROF.chat, PROF.photos[PROF.idx]);
  }else{
    img.style.display='none'; init.style.display='flex';
    init.textContent=initials(name); init.style.background=color(PROF.chat);
  }
  const multi=PROF.carousel && PROF.photos.length>1;
  $('#pprev').style.display=$('#pnext').style.display=multi?'':'none';
  const cnt=$('#pcount');
  if(multi){ cnt.style.display=''; cnt.textContent=(PROF.idx+1)+' / '+PROF.photos.length; }
  else cnt.style.display='none';
}
async function openProfile(chatId){
  chatId=String(chatId);
  let data={};
  try{ data=await (await fetch('/api/profile?bot='+BOT.botId+'&chat='+encodeURIComponent(chatId))).json(); }catch{}
  PROF={user:data.user||{}, photos:data.photos||[], idx:0, carousel:false, chat:chatId};
  renderProfile();
  $('#pmodal').classList.add('open');
}
function closeProfile(){ $('#pmodal').classList.remove('open'); }
$('#chatav').addEventListener('click',()=>{ if(OPEN) openProfile(OPEN); });
$('#pclose').addEventListener('click',closeProfile);
$('#pmodal').addEventListener('click',e=>{ if(e.target.id==='pmodal') closeProfile(); });
$('#pimg').addEventListener('click',e=>{
  if(e.target.classList.contains('pnav') || !PROF.photos.length) return;
  if(!PROF.carousel){ PROF.carousel=true; renderProfile(); }          // 2nd tap: enable carousel
  else { $('#lb img').src=fileUrl(PROF.chat, PROF.photos[PROF.idx]); $('#lb').style.display='flex'; }
});
$('#pprev').addEventListener('click',e=>{ e.stopPropagation(); PROF.idx=(PROF.idx-1+PROF.photos.length)%PROF.photos.length; renderProfile(); });
$('#pnext').addEventListener('click',e=>{ e.stopPropagation(); PROF.idx=(PROF.idx+1)%PROF.photos.length; renderProfile(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeProfile(); $('#lb').style.display='none'; }
  else if($('#pmodal').classList.contains('open') && PROF.carousel && PROF.photos.length>1){
    if(e.key==='ArrowLeft') $('#pprev').click();
    else if(e.key==='ArrowRight') $('#pnext').click();
  }
});

$('#lb').addEventListener('click',()=>{ $('#lb').style.display='none'; });
$('#go').addEventListener('click',doLogin);
$('#token').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
const saved = localStorage.getItem('tgv_token');
if(saved){ $('#token').value=saved; }
$('#token').focus();
</script>
</body>
</html>
